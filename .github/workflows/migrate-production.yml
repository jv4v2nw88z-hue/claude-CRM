name: Apply migrations to production

# MANUAL ONLY.
#
# `workflow_dispatch` is the sole trigger — there is deliberately no `push`,
# `pull_request` or `schedule` key anywhere in this file. This workflow writes to
# the live database that holds every client relationship the business has, and it
# must never be something a merge can set off by accident. Migrations are kept
# out of the deploy path for the same reason.
#
# Requires the same two secrets as the backup workflow:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIGRATE PRODUCTION to proceed'
        required: true
        type: string
      dry_run:
        description: 'List pending migrations without applying them'
        required: false
        default: false
        type: boolean

# Never let two migration runs overlap. Not cancel-in-progress: interrupting a
# half-applied migration is worse than making the second run wait.
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Gate first, before checkout, so a mistyped confirmation costs nothing and
      # fails at the very top of the log where it is easy to see on a phone.
      - name: Check the confirmation phrase
        run: |
          if [ "${{ inputs.confirm }}" != "MIGRATE PRODUCTION" ]; then
            echo "::error::Confirmation phrase did not match. Nothing has been changed."
            echo "Type exactly:  MIGRATE PRODUCTION"
            exit 1
          fi
          echo "Confirmed. Proceeding against the production database."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install wrangler
        run: npm install --no-save wrangler@4

      - name: Migration files in this commit
        run: |
          echo "### Migration files present" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -1 server/migrations/ | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: What would be applied
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "### Pending before this run" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 migrations list midigitalexpansion-crm --remote 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "### Applied" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # `| tee` would hide a non-zero exit behind tee's success, so the
          # output is captured and the exit code checked explicitly. A migration
          # that fails must fail the run, loudly.
          set +e
          OUTPUT=$(npx wrangler d1 migrations apply midigitalexpansion-crm --remote 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ $STATUS -ne 0 ]; then
            echo "::error::Migration failed — see the output above. The database may be partially migrated."
            exit $STATUS
          fi

      - name: Confirm nothing is left pending
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "### Remaining after this run" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 migrations list midigitalexpansion-crm --remote 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run notice
        if: ${{ inputs.dry_run }}
        run: |
          echo "### Dry run — nothing was applied" >> "$GITHUB_STEP_SUMMARY"
          echo "Re-run with **Dry run** unchecked to apply." >> "$GITHUB_STEP_SUMMARY"
