name: Weekly D1 backup

# D1's Time Travel covers the last 30 days and is the right tool for "someone
# deleted the wrong thing on Tuesday". It does not cover the cases that end a
# business: an account compromise, a billing lapse, a closed account, or a
# platform dispute. Those need a copy that is not inside the platform.
#
# Runs Sunday 03:00 UTC, and on demand so a restore drill doesn't require
# waiting a week.
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    # The export is a full dump of every client relationship in the business.
    # Nothing here may print it, and the artifact must not be public.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install wrangler
        run: npm install --no-save wrangler@4

      - name: Export the production database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%d)
          npx wrangler d1 export midigitalexpansion-crm \
            --remote \
            --output "crm-backup-$STAMP.sql"

          # A "successful" export that produced an empty or truncated file is
          # worse than a failed one, because it looks like a backup. Fail loudly
          # instead: CREATE TABLE "User" must be present and the file non-trivial.
          if [ ! -s "crm-backup-$STAMP.sql" ]; then
            echo "::error::Export produced an empty file"
            exit 1
          fi
          if ! grep -q 'CREATE TABLE .*User' "crm-backup-$STAMP.sql"; then
            echo "::error::Export is missing the User table — dump looks truncated"
            exit 1
          fi
          echo "BACKUP_FILE=crm-backup-$STAMP.sql" >> "$GITHUB_ENV"
          echo "Export OK: $(wc -c < "crm-backup-$STAMP.sql") bytes"

      - name: Upload to R2
        # Skipped automatically until R2 is enabled on the account. The step is
        # here rather than added later so that enabling R2 is the only action
        # needed — see README, "Create the documents bucket".
        if: ${{ secrets.R2_BACKUP_BUCKET != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler r2 object put \
            "${{ secrets.R2_BACKUP_BUCKET }}/$BACKUP_FILE" \
            --file "$BACKUP_FILE" \
            --remote

      - name: Retain as a workflow artifact
        # Belt and braces, and the only destination that works before R2 is on.
        # GitHub keeps it 90 days; R2 is the long-term copy.
        uses: actions/upload-artifact@v4
        with:
          name: crm-backup-${{ github.run_id }}
          path: crm-backup-*.sql
          retention-days: 90
          if-no-files-found: error
